<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <script>
    try {
      var globalTheme = localStorage.getItem('eduportal-theme') === 'light' ? 'light' : 'dark'
      var storedStudentTheme = localStorage.getItem('eduportal-student-theme')
      var studentThemes = ['light', 'dark', 'sakura', 'mint']
      var studentTheme = storedStudentTheme === 'pastel' ? 'sakura'
        : (studentThemes.includes(storedStudentTheme) ? storedStudentTheme : 'dark')
      if (storedStudentTheme !== studentTheme) localStorage.setItem('eduportal-student-theme', studentTheme)
      // Giao diện cũ (Mochi tắt) chỉ có navy/hồng: light/mint hiển thị như navy tối.
      // Mochi là mặc định; ?ui=classic hoặc lựa chọn đã lưu 'classic' thì dùng giao diện cũ.
      var mochiUI = /[?&]ui=mochi\b/.test(location.search) || (!/[?&]ui=classic\b/.test(location.search) && localStorage.getItem('eduportal-ui') !== 'classic')
      var skinTheme = mochiUI ? studentTheme : (studentTheme === 'sakura' ? 'sakura' : 'dark')
      var savedUser = null
      try { savedUser = JSON.parse(localStorage.getItem('edu_user') || 'null') } catch (_) {}
      var route = location.hash.slice(1).split('?')[0]
      if (!route && savedUser?.role === 'STUDENT') route = 'student-dashboard'
      if (!route && savedUser?.role === 'ADMIN') route = 'admin-dashboard'
      var studentRoute = savedUser?.role === 'STUDENT' && ['student-dashboard', 'my-classes', 'my-homeworks', 'weekly-calendar', 'homework-attempt', 'assignment-review', 'history', 'student-report', 'attendance', 'achievements', 'exam-room'].includes(route)
      var adminRoute = savedUser?.role === 'ADMIN' && ['admin-dashboard', 'students', 'grade-blocks', 'classes', 'classes-admin', 'curriculum', 'create-homework', 'homework', 'homework-mgmt', 'admin-history', 'question-bank', 'question-appeals', 'exam-proctoring', 'tuition-ledger', 'activity-logs', 'trial-management', 'class-details', 'student-details', 'student-report', 'assignment-review', 'weekly-calendar'].includes(route)
      if (adminRoute && mochiUI) document.documentElement.dataset.adminUi = 'pro'
      else delete document.documentElement.dataset.adminUi
      if (studentRoute) document.documentElement.dataset.studentTheme = studentTheme
      document.documentElement.dataset.theme = studentRoute
        ? (skinTheme === 'dark' ? 'dark' : 'light') : globalTheme
    } catch (_) {
      document.documentElement.dataset.theme = 'dark'
    }
    document.documentElement.style.colorScheme = document.documentElement.dataset.theme
  </script>
  <title>EduPortal - Hệ Thống Quản Lý Bài Tập Về Nhà Trực Tuyến</title>
